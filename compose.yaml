services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dnd
      POSTGRES_USER: dnd
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dnd -d dnd"]
      interval: 5s
      retries: 20
  migrate:
    image: ghcr.io/chakkosya/dungeonmaster-mcp:latest
    environment:
      DATABASE_URL: postgres://dnd:${DB_PASSWORD}@db:5432/dnd
    depends_on:
      db: {condition: service_healthy}
    command: ["node","dist/migrate.js"]
  server:
    image: ghcr.io/chakkosya/dungeonmaster-mcp:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://dnd:${DB_PASSWORD}@db:5432/dnd
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      PUBLIC_URL: ${PUBLIC_URL}
      PORT: 3000
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD","wget","-q","-O","/dev/null","http://127.0.0.1:3000/readyz"]
      interval: 10s
      retries: 10
  worker:
    image: ghcr.io/chakkosya/dungeonmaster-mcp:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://dnd:${DB_PASSWORD}@db:5432/dnd
      BACKUP_DIR: /backups
    volumes:
      - backups:/backups
    depends_on:
      migrate: {condition: service_completed_successfully}
    command: ["node","dist/worker.js"]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      server: {condition: service_healthy}
volumes:
  postgres_data:
  backups:
  caddy_data:
  caddy_config:
